# Runs the full pytest suite when this folder is the repository root.
# Checkout is actions/checkout v7.0.1. Python setup is actions/setup-python v7.1.0.
# Both are pinned to those commits on 30 October 2026. pytest is pinned to 9.1.1.
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - name: Run the suite
        run: python -m pytest tests -q
